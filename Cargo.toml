[workspace]
members = [
    "verifier/api-types",
    "verifier/client",
    "verifier/e2e",
    "verifier/enclave-types",
    "verifier/sealed-types",
    "verifier/enclave",
    "verifier/host",
    "verifier/protocol",
    "di/enclave",
    "verifier/worker-rpc",
    "verifier/worker-protocol",
    "di/host",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.3.0"
license = "MIT"
homepage = "https://github.com/worldcoin/flamingo"
repository = "https://github.com/worldcoin/flamingo"
publish = false

[workspace.dependencies]
anyhow = "1.0"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5" }
ark-ff = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
ciborium = "0.2"
coset = "0.4.2"
flamingo-verifier-api-types = { version = "0.3.0", path = "verifier/api-types" }
flamingo-verifier-client = { path = "verifier/client" }
flamingo-verifier-enclave-types = { path = "verifier/enclave-types" }
flamingo-verifier-protocol = { version = "0.3.0", path = "verifier/protocol" }
flamingo-verifier-sealed-types = { version = "0.3.0", path = "verifier/sealed-types" }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.5" }
face-engine = { git = "https://github.com/worldcoin/biometric-engines", rev = "face-engine-v2.16.0", default-features = false, features = ["tract"] }
flamingo-verifier-worker-protocol = { path = "verifier/worker-protocol" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hex-literal = "1.1"
http-body-util = "0.1"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
pontifex = { version = "2.0.0", default-features = false }
poseidon2 = { package = "taceo-poseidon2", version = "0.2" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
telemetry-batteries = { version = "0.4.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
