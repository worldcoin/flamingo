[workspace]
members = [
    "verifier/api-types",
    "verifier/client",
    "verifier/e2e",
    "verifier/enclave-types",
    "verifier/sealed-types",
    "verifier/enclave",
    "verifier/host",
    "verifier/protocol",
    "verifier/sandbox-client",
    "verifier/sandbox-bundle",
    "verifier/enclave-provisioner",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.4.0"
license = "MIT"
homepage = "https://github.com/worldcoin/flamingo"
repository = "https://github.com/worldcoin/flamingo"
publish = false

[workspace.dependencies]
biometric-engines-protocol = { package = "takis-biometric-engine-protocol", version = "0.1.0" }
anyhow = "1.0"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5" }
ark-ff = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
ciborium = "0.2"
coset = "0.4.2"
flamingo-verifier-api-types = { version = "0.4.0", path = "verifier/api-types" }
flamingo-verifier-client = { path = "verifier/client" }
flamingo-verifier-enclave-types = { path = "verifier/enclave-types" }
flamingo-verifier-protocol = { version = "0.4.0", path = "verifier/protocol" }
flamingo-verifier-sealed-types = { version = "0.4.0", path = "verifier/sealed-types" }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.5" }
flamingo-verifier-sandbox-client = { path = "verifier/sandbox-client" }
flamingo-verifier-sandbox-bundle = { path = "verifier/sandbox-bundle" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hex-literal = "1.1"
http-body-util = "0.1"
libc = "0.2"
minijail = { git = "https://github.com/google/minijail", rev = "b0b5dc6997956cdc027295ade5e425c416f30d33" }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384"] }
pontifex = { version = "2.0.0", default-features = false }
poseidon2 = { package = "taceo-poseidon2", version = "0.2" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"
tempfile = "3.27"
vsock = "0.5.4"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
telemetry-batteries = { version = "0.4.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
