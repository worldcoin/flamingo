[workspace]
members = [
    "verifier/api-types",
    "verifier/client",
    "verifier/e2e",
    "verifier/enclave-types",
    "verifier/sealed-types",
    "verifier/enclave",
    "verifier/host",
    "verifier/sandbox-client",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.9.0"
license = "MIT"
homepage = "https://github.com/worldcoin/flamingo"
repository = "https://github.com/worldcoin/flamingo"
publish = false

[workspace.dependencies]
biometric-engines-protocol = "0.1.0"
anyhow = "1.0"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6" }
ark-ff = "0.6"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
coset = "0.4.2"
flamingo-verifier-api-types = { version = "0.9.0", path = "verifier/api-types" }
flamingo-verifier-client = { path = "verifier/client" }
flamingo-verifier-enclave-types = { path = "verifier/enclave-types" }
flamingo-verifier-sealed-types = { version = "0.9.0", path = "verifier/sealed-types" }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.6" }
flamingo-verifier-sandbox-client = { path = "verifier/sandbox-client" }
futures-util = "0.3"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hex-literal = "1.1"
http-body-util = "0.1"
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384"] }
pontifex = { version = "3.1.0", default-features = false }
poseidon2 = { package = "taceo-poseidon2", version = "0.3" }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
# Bootstrap schema 4; pair with a matching provisioner.
tabernaculum = { git = "https://github.com/worldcoin/tabernaculum", tag = "v0.2.0" }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "url"] }
tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
telemetry-batteries = { version = "0.4.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
webpki-roots = "1.0.10"
world-id-flamingo = "0.17.0"
world-id-primitives = { version = "0.17.0", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
