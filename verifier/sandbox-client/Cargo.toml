[package]
name = "flamingo-verifier-sandbox-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-worker = []

[dependencies]
biometric-engines-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
minijail.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
flamingo-verifier-sandbox-bundle.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "sandbox-client-test-peer"
path = "tests/support/fake-worker.rs"
required-features = ["test-worker"]
test = false

[[test]]
name = "process"
required-features = ["test-worker"]
harness = false
