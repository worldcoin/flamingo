[package]
name = "flamingo-verifier-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "flamingo-verifier-host"
path = "src/main.rs"

[features]
# A stand-in enclave for local runs. Never in a release build: the guard in `lib.rs` refuses to
# compile one, so a mock cannot reach an environment that expects attested answers.
mock-enclave = ["dep:sha2"]

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
flamingo-verifier-api-types.workspace = true
flamingo-verifier-enclave-types.workspace = true
pontifex = { workspace = true, features = ["client"] }
rand.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
telemetry-batteries = { workspace = true, features = ["axum"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
k256.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
