[package]
name = "flamingo-verifier-client"
description = "Attestation-verifying client for the Flamingo verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[features]
default = ["http"]
# Hosts use api_types without crypto or HTTP dependencies; enclaves enable sealed-types.
protocol = ["dep:ark-babyjubjub", "dep:ark-ff", "dep:coset", "dep:eddsa-babyjubjub", "dep:poseidon2", "dep:serde_bytes"]
sealed-types = ["protocol", "dep:sha2", "dep:ciborium", "dep:zeroize"]
http = ["sealed-types", "dep:pontifex", "dep:base64", "dep:hex", "dep:reqwest", "dep:serde_json", "dep:thiserror", "dep:url"]

[dependencies]
serde.workspace = true
ark-babyjubjub = { workspace = true, optional = true }
ark-ff = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
eddsa-babyjubjub = { workspace = true, optional = true }
poseidon2 = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }
pontifex = { workspace = true, optional = true, features = ["channel", "attestation"] }
hex = { workspace = true, optional = true, features = ["serde"] }

[dev-dependencies]
axum.workspace = true
hex-literal.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[test]]
name = "memory"
required-features = ["sealed-types"]

[[test]]
name = "assignment"
required-features = ["http"]

[[test]]
name = "stickiness"
required-features = ["http"]
