[package]
name = "flamingo-verifier-client"
description = "Attestation-verifying client for the Flamingo verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[dependencies]
pontifex = { workspace = true, features = ["channel", "attestation"] }
base64.workspace = true
flamingo-verifier-api-types.workspace = true
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
hex = { workspace = true, features = ["serde"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
hex-literal.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
wasm-bindgen = "=0.2.126"
