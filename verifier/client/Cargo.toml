[package]
name = "flamingo-verifier-client"
description = "Attestation-verifying client for the Flamingo verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[dependencies]
pontifex = { workspace = true, features = ["channel", "attestation"] }
base64.workspace = true
flamingo-verifier-api-types.workspace = true
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
futures-util = { workspace = true, features = ["sink"] }
hex = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-time = "1"
ws_stream_wasm = "0.7.5"

[dev-dependencies]
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
hex-literal.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true
