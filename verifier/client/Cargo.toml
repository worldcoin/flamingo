[package]
name = "flamingo-verifier-client"
description = "Attestation-verifying client for the Flamingo verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[dependencies]
pontifex = { workspace = true, features = ["channel", "attestation"] }
base64.workspace = true
flamingo-verifier-api-types.workspace = true
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
futures-util = { workspace = true, features = ["sink"] }
hex = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
url.workspace = true

[dev-dependencies]
flamingo-verifier-protocol.workspace = true
flamingo-verifier-sealed-types.workspace = true
hex-literal.workspace = true
tokio.workspace = true
