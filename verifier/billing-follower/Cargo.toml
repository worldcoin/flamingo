[package]
name = "flamingo-verifier-billing-follower"
description = "Follows the WIP-107 Billing Contract for the Flamingo host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy = { workspace = true, features = [
    "eips",
    "network",
    "providers",
    "provider-http",
    "reqwest",
    "reqwest-rustls-tls",
    "rpc-client",
    "rpc-types-eth",
    "sol-types",
    "transports",
] }
flamingo-verifier-billing-state.workspace = true
metrics.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true
world-id-primitives.workspace = true
world-id-registries.workspace = true

[dev-dependencies]
alloy = { workspace = true, features = ["contract", "node-bindings", "signer-local"] }
eyre.workspace = true
tokio = { workspace = true, features = ["test-util"] }
