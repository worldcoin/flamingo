[package]
name = "flamingo-verifier-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "verifier-enclave"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
flamingo-verifier-api-types.workspace = true
flamingo-verifier-enclave-types.workspace = true
flamingo-verifier-sealed-types.workspace = true
eddsa-babyjubjub.workspace = true
flamingo-engine-interface.workspace = true
hex.workspace = true
pontifex = { workspace = true, features = ["nsm", "server", "channel"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
world-id-flamingo.workspace = true
world-id-primitives.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flamingo-verifier-sandbox-client.workspace = true
tabernaculum.workspace = true

[dev-dependencies]
base64.workspace = true
tokio = { workspace = true, features = ["test-util"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
