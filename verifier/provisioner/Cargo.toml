[package]
name = "flamingo-verifier-provisioner"
description = "Boots a Flamingo enclave, sideloads its worker and loads its release manifest before readiness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
flamingo-verifier-enclave-types.workspace = true
hex.workspace = true
libc = "0.2"
pontifex = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tabernaculum-provisioner.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
