graph:
  # Minimal placeholder graph: detect one subject without quality or liveness validation.
  - node_name: rgb_net
    node_type: RGBNet
    dependencies: ["input"]
    args:
      # Use the model bytes embedded in the worker executable.
      model_path: null
      confidence_threshold: 0.8
      iou_threshold: 0.3

  - node_name: largest_bounding_box_subject_extractor
    node_type: LargestBoundingBoxSubjectExtractor
    dependencies: ["input", "rgb_net"]
    args:
      correct_inferred_orientation: false
