graph:
  # Generate the comparison embedding only; spoof and quality nodes are intentionally omitted.
  - node_name: ghost_face_net
    node_type: GhostFaceNet
    dependencies: ["input"]
    args:
      # Packaged at this fixed location in the prototype enclave image.
      model_path: /models/face_embedding_generator.onnx
      # Match Face Engine's default by averaging embeddings for the image and its horizontal flip.
      average_with_flipped: true
