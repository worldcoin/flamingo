# The e2e/ workspace: a WIP-202 proof from an in-process Verifier. Minutes long, so not on every PR.
name: WIP-202 e2e

on:
  pull_request:
    paths:
      # The root manifest carries the world-id-* versions the e2e rev must match.
      - "Cargo.toml"
      - "e2e/**"
      - ".github/workflows/wip202-e2e.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  e2e:
    name: wip202 e2e
    # ubuntu-26.04's kernel headers break the pinned minijail-sys build (blk_user_trace_setup2).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: versions
        run: ./check-versions.sh
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev clang pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: e2e
      # world-id-test-utils' build script runs `forge build` on the contracts in cargo's git checkout.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: 1.7.1
      # world-id-proof's build script compiles the embedding similarity circuit with this exact nargo.
      - uses: noir-lang/noirup@7dbe69ccc78877f0200ffa5a40836c953d2cfd8f # v0.1.4
        with:
          toolchain: v1.0.0-beta.26
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked -- --nocapture
