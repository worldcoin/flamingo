name: release hosts

on:
  push:
    tags:
      - "flamingo-verifier-host/v*"
      - "di-host/v*"
  workflow_dispatch:
    inputs:
      workload:
        description: "Host to release."
        required: true
        type: choice
        options: [verifier, di]
      ref:
        description: "Branch, tag, or commit SHA to build."
        required: true
        type: string
      version:
        description: "Release version, without the v prefix."
        required: true
        type: string
      dry_run:
        description: "Build without publishing."
        required: false
        default: true
        type: boolean

concurrency:
  group: release-hosts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      workload: ${{ steps.release.outputs.workload }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: release
        env:
          INPUT_WORKLOAD: ${{ inputs.workload }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            case "$GITHUB_REF_NAME" in
              flamingo-verifier-host/v*) workload=verifier ;;
              di-host/v*) workload=di ;;
              *) echo "::error::Unknown host tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
            version="${GITHUB_REF_NAME#*/v}"
            publish=true
          else
            workload="$INPUT_WORKLOAD"
            version="$INPUT_VERSION"
            publish=$([[ "$DRY_RUN" == "true" ]] && echo false || echo true)
          fi
          case "$workload" in
            verifier) tag="flamingo-verifier-host/v$version" ;;
            di) tag="di-host/v$version" ;;
            *) echo "::error::Unknown workload: $workload" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z._-]*$ ]] || (( ${#version} > 127 )); then
            echo "::error::Version must fit a Docker tag with a v prefix." >&2; exit 1;
          fi
          {
            echo "workload=$workload"
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: v${{ needs.prepare.outputs.version }}
      workload: ${{ needs.prepare.outputs.workload }}
      push: ${{ needs.prepare.outputs.publish == 'true' }}

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          printf 'Host image: `%s@%s`\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/body.md"
          gh release create --draft --target "$RELEASE_SHA" -t "$RELEASE_TAG" \
            -F "$RUNNER_TEMP/body.md" "$RELEASE_TAG"
