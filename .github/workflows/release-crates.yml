name: Release Crates

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-crates:
    name: Release Crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_TERMINAL_PROMPT: "0"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1

      - name: Fetch dependencies
        timeout-minutes: 10
        run: cargo fetch --locked

      # Publish the prepared version before preparing the next release PR.
      - name: Publish crates
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limit release analysis to the public workspace
        # release-plz 0.3.160 packages historical commits before checking release
        # boundaries. Earlier snapshots need private biometric-engine dependencies.
        # Make the public-workspace migration the root of this temporary checkout.
        run: git rev-parse ec2b0b7186c958638687ef6b87c32066ffd9f382 > "$(git rev-parse --git-path shallow)"

      - name: Update release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
