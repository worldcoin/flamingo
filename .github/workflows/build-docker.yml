# Builds and publishes the host images to GHCR (attested).
#
# Enclave OCI images and EIFs are built reproducibly by flake.nix. This workflow only builds
# and publishes host images.
name: Build and Push Docker Image

on:
  pull_request:
    paths:
      - "verifier/**"
      - "di/**"
      - "shared/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/build-docker.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (including v prefix, e.g. v0.1.0)"
        required: false
        type: string
      push:
        description: "Push images to GHCR."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Defaults to the calling workflow's ref."
        required: false
        type: string
      version:
        description: "Version tag to publish (including v prefix)."
        required: false
        type: string
      workload:
        description: "Build only this workload's host image. Empty builds all."
        required: false
        type: string
      push:
        description: "Push to GHCR. False builds only."
        required: false
        default: true
        type: boolean
    outputs:
      digest:
        description: "Digest of the selected workload's host image, when exactly one was built."
        value: ${{ jobs.docker-build.outputs.digest }}
      image:
        description: "Fully-qualified name of that image, so callers need no second copy of the mapping."
        value: ${{ jobs.docker-build.outputs.image }}

permissions:
  contents: read


jobs:
  # A static matrix cannot be filtered by an input, and release-hosts.yml needs one workload at a
  # time. Cheaper than duplicating the build job per workload.
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Select workloads
        id: matrix
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          all='[
            {"name":"flamingo-verifier-host","dockerfile":"verifier/host/Dockerfile","image":"flamingo-verifier","workload":"verifier"},
            {"name":"di-host","dockerfile":"di/host/Dockerfile","image":"flamingo-verifier-di-host","workload":"di"}
          ]'
          if [[ -n "${WORKLOAD:-}" ]]; then
            include=$(jq -c --arg w "$WORKLOAD" 'map(select(.workload == $w))' <<<"$all")
            if [[ "$(jq 'length' <<<"$include")" == "0" ]]; then
              echo "::error::No host image for workload '$WORKLOAD'." >&2
              exit 1
            fi
          else
            include=$(jq -c . <<<"$all")
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker build (${{ matrix.name }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          # `latest` only for stable semver (no -alpha / -rc suffix).
          if [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || steps.version.outputs.is_stable == 'true' }}
            type=sha
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Publish on push/tag/dispatch; PRs and dry runs build only (validation).
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.push == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
