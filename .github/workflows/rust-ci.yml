# Root Cargo workspace checks. Dependency auditing is supply-chain.yml.
name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  version-alignment:
    name: Version Alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: worldcoin/bedrock/.github/actions/version-alignment@857c252013ac52cea24f5d7add3475a909d663f2
        with:
          uniffi_version: ${{ vars.UNIFFI_VERSION }}
          rust_toolchain_channel: ${{ vars.RUST_TOOLCHAIN_CHANNEL }}

  cargo-clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          app-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
      - name: Public release boundary tests
        run: |
          python3 scripts/tests/test_public_release.py
          python3 scripts/check-public-release.py
      - name: Inference dependency boundary
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/public-metadata.json"
          jq -e 'all(.packages[]; .name != "flamingo-verifier-worker" and .name != "face-engine" and (if ((.source // "") | contains("biometric-engines")) then .name == "biometric-engines-protocol" else true end))' "$RUNNER_TEMP/public-metadata.json"
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --

  cargo-tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          app-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
      - name: tests
        run: cargo test --locked --workspace --all-features --exclude flamingo-verifier-sandbox-client --verbose
      - name: Carrier lifecycle tests
        run: python3 scripts/tests/test_worker_carrier.py
      - name: Bounded protocol client tests
        run: cargo test --locked -p flamingo-verifier-sandbox-client --test client
      - name: Minijail process tests
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo test --locked \
            --target x86_64-unknown-linux-gnu -p flamingo-verifier-sandbox-client --all-features --no-run \
            --message-format=json > target/worker-test-artifacts.json
          test_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "process") | .executable // empty' target/worker-test-artifacts.json)
          test -n "$test_binary"
          sudo timeout --kill-after=5s 60s "$test_binary"

  # Model credentials are gone; the protocol still needs private Git until published.
  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      # crane fetches the private dependency with `builtins.fetchGit`, which uses the host's git
      # credentials. A helper rather than `insteadOf`, whose behaviour depends on Nix's git backend.
      - name: Authorize git for biometric-engines
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # shellcheck disable=SC2016  # the helper must expand GH_APP_TOKEN when git runs it.
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: otherwise a new flake.nix input resolves against upstream right
      # now and the lock is quietly rewritten.
      - name: Evaluate the enclave image and converter derivations
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          for output in verifier-enclave sandbox-bundle verifier-oci verifier-eif; do
            drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
            echo "$output -> $drv"
          done
      # No image is built here. The DI enclave used to be the cheap build smoke test; with it
      # gone the only remaining image is the verifier's ~90-minute build, so build errors that
      # evaluation does not catch now surface first in release-enclaves.yml.
