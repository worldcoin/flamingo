name: Setup Rust
description: Rust toolchain and Cargo cache.

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcap-dev clang pkg-config protobuf-compiler

    - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
      with:
        toolchain: 1.98.1
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
