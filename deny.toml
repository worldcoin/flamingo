# One policy for the repository's root Cargo workspace.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
    # Required by Pontifex's AWS NSM dependencies; no maintained compatible release exists.
    "RUSTSEC-2021-0127",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
    # Inference runs in the provisioned sandbox, never in a public broker artifact.
    { name = "biometric-engines" },
    { name = "biometric-engines-worker" },
    { name = "flamingo-verifier-worker" },
    { name = "face-engine" },
    { name = "ort" },
    { name = "ort-sys" },
    { name = "onnxruntime" },
    { name = "onnxruntime-sys" },
    { name = "hf-hub" },
]

[licenses]
version = 2
confidence-threshold = 1.0
unused-allowed-license = "allow"
# Workspace crates are not published; public dependencies still require approved licenses.
private = { ignore = true }
allow = [
    "Apache-2.0",
    # Reached via blake3, which taceo-eddsa-babyjubjub uses to expand signing keys.
    # Permissive, OSI-approved, and no more restrictive than BSD-3-Clause below.
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Reached via webpki-roots, the Mozilla CA bundle rustls uses in the verifier client.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    # Upstream protocol generation reaches foldhash through prost-build/petgraph.
    { allow = ["Zlib"], name = "foldhash", version = "0.1.5" },
    # telemetry-batteries uses this public-domain instrumentation helper for HTTP spans.
    { allow = ["CC0-1.0"], name = "tracing-opentelemetry-instrumentation-sdk", version = "0.38.3" },
    # telemetry-batteries reaches option-ext through dirs; MPL's copyleft is file-scoped.
    { allow = ["MPL-2.0"], name = "option-ext", version = "0.2.0" },
]

# cargo-deny cannot infer webpki's ISC license from its text. Copied from bedrock's deny.toml.
[[licenses.clarify]]
name = "webpki"
version = "0.22.4"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# Minijail's Rust crates inherit the repository's BSD license but omit Cargo metadata.
[[licenses.clarify]]
name = "minijail"
version = "0.2.3"
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0x51549d2b }]

[[licenses.clarify]]
name = "minijail-sys"
version = "0.0.14"
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0x51549d2b }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
# Pontifex is temporarily pinned to the debug-measurements draft; remove after release.
allow-git = [
    "https://github.com/google/minijail",
    "https://github.com/worldcoin/pontifex",
]
